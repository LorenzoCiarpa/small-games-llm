# Codex without tools, so that the LLMs write code under the same conditions as the weights.
# It starts from the article's configuration (lm_understand-logs, harness/codex_config.toml), adapted to Codex 0.164.
# run_codex.py uses it as the config.toml of a temporary CODEX_HOME, so no MCP servers, skills, plugins or
# instructions from the personal configuration.
#
# This is not enough: in Codex 0.164 code mode, agents, apply_patch, the shell, search and the clock are decided by
# the model catalog (for gpt-6-astra tool_mode = "code_mode_only", multi_agent_version = "v2"). run_codex.py
# writes a copy of the catalog without those fields, passes it with -c model_catalog_json=..., and then checks with
# `codex debug prompt-input` that the model sees no tool.
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

# no context blocks added by Codex: environment, permissions, apps
include_environment_context = false
include_permissions_instructions = false
include_apps_instructions = false

[skills]
include_instructions = false

[tools.experimental_request_user_input]
enabled = false

[features]
apps = false
browser_annotation_api = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
code_mode = false
code_mode_host = false
computer_use = false
goals = false
hooks = false
image_generation = false
in_app_browser = false
in_app_local_automation = false
memories = false
multi_agent = false
multi_agent_v2 = false
plugins = false
remote_plugin = false
shell_snapshot = false
shell_tool = false
skill_mcp_dependency_install = false
skill_search = false
sleep_tool = false
tool_suggest = false
unified_exec = false
unified_exec_tty = false
view_image = false
workspace_dependencies = false
